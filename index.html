<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vinyl Player 2.0 — Persisted Playlist + Drag/Drop + Art</title>

  <!-- jsmediatags CDN for ID3 album-art extraction -->
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div style="display:flex;gap:12px;align-items:center">
      <div class="logo">VP</div>
      <div>
        <div style="font-weight:700">Vinyl Player 2.0</div>
      </div>
    </div>

    <div style="display:flex;gap:12px;align-items:center">
      <div class="toggle small">
        <div id="shuffleSwitch" class="switch" title="Shuffle">
          <div class="knob"></div>
        </div>
        <div class="small">Shuffle</div>
      </div>
      <div class="toggle small">
        <div id="loopSwitch" class="switch" title="Loop track">
          <div class="knob"></div>
        </div>
        <div class="small">Loop</div>
      </div>
    </div>
  </div>

  <div class="player" id="player">
    <div class="left">
      <div class="vinyl-wrap">
        <div id="vinyl" class="vinyl">
          <div class="vinyl-disc" id="vinylDisc">
            <div class="vinyl-reflection" id="vinylReflection"></div>
          </div>
          <div class="vinyl-label" id="vinylLabel">
            <img id="labelImg" src="" alt="Label">
            <video id="labelVideo" loop muted style="display:none"></video>
          </div>
        </div>
        <div class="spindle"></div>
        <div id="tonearm" class="tonearm lifted"></div>

        <!-- dust particles -->
        <div class="dust" id="dust"></div>
      </div>

      <canvas id="waveformCanvas" class="waveformCanvas" width="560" height="80"></canvas>
      <canvas id="visualizerCanvas" class="visualizer" width="360" height="48"></canvas>

      <div class="controls-bottom">
        <label class="small">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" class="slider">
        <label class="small">Speed</label>
        <input id="speed" type="range" min="0.5" max="1.5" step="0.01" value="1" class="slider">
      </div>
    </div>

    <div class="right">
      <div class="track-meta">
        <div id="title" class="title">No media loaded</div>
        <div id="artist" class="artist">Add audio/video — drag & drop or use + Add</div>
      </div>

      <div class="controls">
        <button id="prev" class="btn">⟸</button>
        <button id="play" class="btn primary">Play</button>

        <button id="next" class="btn">⟹</button>
        <label class="btn" for="file">+ Add</label>
        <input id="file" type="file" accept="audio/*,video/*" multiple style="display:none">
      </div>

      <div class="progress">
        <div id="progressBar" class="bar"><i id="progressFill"></i></div>
        <div class="time"><span id="current">0:00</span> / <span id="duration">0:00</span></div>
      </div>

      <div class="playlist" id="playlist"></div>
    </div>

    <audio id="audioA" crossorigin="anonymous"></audio>
  </div>
</div>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
